backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Hero Title", name: "title", widget: "string"}
          - {label: "Hero Description", name: "description", widget: "text"}

  - name: "about"
    label: "O Tomislavgradu"
    files:
      - file: "content/about.md"
        label: "Tekst o Tomislavgradu"
        name: "about"
        fields:
          - {label: "Naslov", name: "title", widget: "string"}
          - {label: "Prvi pasus", name: "paragraph1", widget: "text"}
          - {label: "Drugi pasus", name: "paragraph2", widget: "text"}